name: Quality and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Tests, build, format and production audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 action runtime
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  deploy:
    name: Deploy tested revision
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 action runtime
        with:
          node-version: 22.14.0
          cache: npm
      - name: Require deployment configuration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_DEPLOY_HOOK; do
            if [ -z "${!key}" ]; then echo "::error::Missing deployment setting: $key"; exit 1; fi
          done
      - name: Verify Vercel project and team access
        run: |
          node --input-type=module <<'NODE'
          const { VERCEL_TOKEN: token, VERCEL_ORG_ID: team, VERCEL_PROJECT_ID: project } = process.env;
          const endpoints = [
            `/v9/projects/${encodeURIComponent(project)}?teamId=${encodeURIComponent(team)}`,
            `/teams/${encodeURIComponent(team)}`,
          ];
          try {
            const [projectResponse, teamResponse] = await Promise.all(endpoints.map(path => fetch(`https://api.vercel.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            })));
            // Never print the token, headers or provider response bodies.
            if (!projectResponse.ok) {
              console.error(`::error::Vercel project access failed (HTTP ${projectResponse.status}). Check token expiry, Gallery access and the project/team variables.`);
              process.exitCode = 1;
            } else {
              const metadata = await projectResponse.json();
              if (metadata.id !== project || metadata.accountId !== team) {
                console.error('::error::Vercel returned a different project/team. Review the deployment variables.');
                process.exitCode = 1;
              }
            }
            if (!teamResponse.ok) {
              console.error(`::error::Vercel team access failed (HTTP ${teamResponse.status}). The pull/build CLI needs a token scoped to the owning team, not only the Gallery project. Replace VERCEL_TOKEN in the production environment.`);
              process.exitCode = 1;
            }
            if (!process.exitCode) console.log('Vercel token can access Gallery and its owning team.');
          } catch {
            console.error('::error::Unable to verify Vercel access. Check provider connectivity and the token; credentials were not logged.');
            process.exitCode = 1;
          }
          NODE
      - run: npm ci
      - run: npm install --global vercel@50.5.0
      - run: vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - run: vercel build --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Stage and verify the tested revision before promotion
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then echo "A newer revision is queued; skipping this deployment."; exit 0; fi
          url=$(vercel deploy --prebuilt --prod --skip-domain --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")
          echo "Staged deployment: $url"
          vercel curl /api/health --deployment="$url" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" > /tmp/health.json
          node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync("/tmp/health.json")).status!=="ok")process.exit(1)'
          vercel curl '/api/artworks?limit=1' --deployment="$url" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" > /tmp/gallery.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/gallery.json"));if(!Array.isArray(x.items))process.exit(1)'
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then echo "A newer revision arrived; leaving this deployment staged."; exit 0; fi
          vercel promote "$url" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Deploy the notification processor after quality checks
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then exit 0; fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK&ref=$GITHUB_SHA" > /dev/null
